
<form sd-value="camac_settings">
  <h3>CAMAC Setup</h3>
  <table>
    <tr><th>Crate</th><td>
      <select name="crate">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </td></tr>
  </table>
  <table>
    <tr><th>Name</th><th>Station (N)</th><th>LAM</th><th>Readout Channels (A)</th><th>Histogram Range</th></tr>
    <tr>
      <td><input name="name0" value="module0" style="width:5em"></td>
      <td><select name="station0">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select></td><td>
        <input type="radio" name="lam" value="0" checked>
      </td><td>
        <input type="checkbox" name="m0_ch0">0 
        <input type="checkbox" name="m0_ch1">1 
        <input type="checkbox" name="m0_ch2">2 
        <input type="checkbox" name="m0_ch3">3
        <input type="checkbox" name="m0_ch4">4 
        <input type="checkbox" name="m0_ch5">5 
        <input type="checkbox" name="m0_ch6">6 
        <input type="checkbox" name="m0_ch7">7
      </td><td><input name="range0" value="4096" style="width:5em">
    </td></tr>
    <tr>
      <td><input name="name1" value="module1" style="width:5em"></td>
      <td><select name="station1">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select></td><td>
        <input type="radio" name="lam" value="1">
      </td><td>
        <input type="checkbox" name="m1_ch0">0 
        <input type="checkbox" name="m1_ch1">1 
        <input type="checkbox" name="m1_ch2">2 
        <input type="checkbox" name="m1_ch3">3
        <input type="checkbox" name="m1_ch4">4 
        <input type="checkbox" name="m1_ch5">5 
        <input type="checkbox" name="m1_ch6">6 
        <input type="checkbox" name="m1_ch7">7
      </td><td><input name="range1" value="4096" style="width:5em">
    </td></tr>
    <tr>
      <td><input name="name2" value="module2" style="width:5em"></td>
      <td><select name="station2">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select></td><td>
        <input type="radio" name="lam" value="2">
      </td><td>
        <input type="checkbox" name="m2_ch0">0 
        <input type="checkbox" name="m2_ch1">1 
        <input type="checkbox" name="m2_ch2">2 
        <input type="checkbox" name="m2_ch3">3
        <input type="checkbox" name="m2_ch4">4 
        <input type="checkbox" name="m2_ch5">5 
        <input type="checkbox" name="m2_ch6">6 
        <input type="checkbox" name="m2_ch7">7
      </td><td><input name="range2" value="4096" style="width:5em">
    </td></tr>
    <tr>
      <td><input name="name3" value="module3" style="width:5em"></td>
      <td><select name="station3">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select></td><td>
        <input type="radio" name="lam" value="3">
      </td><td>
        <input type="checkbox" name="m3_ch0">0 
        <input type="checkbox" name="m3_ch1">1 
        <input type="checkbox" name="m3_ch2">2 
        <input type="checkbox" name="m3_ch3">3
        <input type="checkbox" name="m3_ch4">4 
        <input type="checkbox" name="m3_ch5">5 
        <input type="checkbox" name="m3_ch6">6 
        <input type="checkbox" name="m3_ch7">7
      </td><td><input name="range3" value="4096" style="width:5em">
    </td></tr>
  </table>
    
  <h3>Run Control</h3>
  <table>
    <tr>
      <td>Measurement</td>
      <td><input name="measurement" value="Camac" sd-value="run_settings['measurement']" style="width:10em"></td>
      <td style="font-size:80%">(used for data file name)</td>
    </tr><tr>
      <td>Run Number</td>
      <td><input name="run_number" type="number" step="1" value="1" sd-value="run_settings['run_number']" sd-live="true" style="width:10em"></td>
      <td><input type="checkbox" name="offline" sd-value="run_settings['offline']">Offline</td>
    </tr><tr>
      <td>Run Length (sec):</td>
      <td><input type="number" name="run_length" style="width:10em" value="0" sd-value="run_settings['run_length']"></td>
      <td><input type="checkbox" name="repeat" sd-value="run_settings['repeat']">Repeat</td>
    </tr>
  </table>
  <p>
  <div style="font-size:150%">
    <input type="submit" name="await camac.start()" value="Start" sd-enabled="run_status['running']->invert()">
    <input type="submit" name="await camac.stop()" value="Stop" sd-enabled="run_status['running']">
  </div> 
</form>
