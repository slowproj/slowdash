slowdash_project:
  name: Nanotech_Motor

  environment:
    - DB_URL=${DB_URL:-sqlite:///SlowMotor}

  data_source:
    url: ${DB_URL}
    time_series:
      schema: data [channel] @timestamp(unix) = value

  task:
    name: NanotechMotor
    auto_load: true
    parameters:
      IP: "10.0.0.3"
      db_url: ${DB_URL}
