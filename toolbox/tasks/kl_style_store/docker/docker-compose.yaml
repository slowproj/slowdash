# PostgreSQL with kl_style_store installed. See "Quick start" in ../README_ja.md.
#   docker compose up -d
# The variables (e.g. KL_WRITER_PASSWORD=... docker compose up -d) are used
# only when the database is created, except KL_DB_PORT and KL_DATA.

services:
  db:
    image: postgres:16
    restart: always
    command: postgres -c max_locks_per_transaction=512
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${KL_DB_NAME:-kldb}
      - KL_ADMIN_PASSWORD=${KL_ADMIN_PASSWORD:-}
      - KL_WRITER_PASSWORD=${KL_WRITER_PASSWORD:-writer}
      - KL_MONITOR_PASSWORD=${KL_MONITOR_PASSWORD:-monitor}
      - KL_ANALYZER_PASSWORD=${KL_ANALYZER_PASSWORD:-analyzer}
    volumes:
      - ../sql:/kl_style_store/sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # the data: a docker volume by default; for real use, a directory on the host (KL_DATA=/path/to/dir)
      - ${KL_DATA:-kl_data}:/var/lib/postgresql/data
    # open to the network: for a closed network only; change the passwords
    ports:
      - "${KL_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kl_data:
