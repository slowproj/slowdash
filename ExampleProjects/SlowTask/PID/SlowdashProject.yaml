slowdash_project:
  name: PID Control
  
  data_source:
    url: sqlite:///SlowData
    time_series:
      schema: numeric_data [channel] @timestamp(unix) = value
    object_time_series:
      schema: object_data [channel] @timestamp(unix) = value

  task:
    - name: pid
      auto_load: true

  system:
    our_security_is_perfect: true
