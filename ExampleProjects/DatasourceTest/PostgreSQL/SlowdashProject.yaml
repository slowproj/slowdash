slowdash_project:
  name: PostgreSQL_Test
  
  data_source:
    #type: PostgreSQL           # default: Async version, uses asyncpg
    #type: PostgreSQL_NoAsync   # No-Async default: enable this to enforce this No-Async version (psycopg2)
    
    url: ${DB_URL:-postgresql://slowdash:slowdash@localhost:5432/SlowStore}
    
    time_series:
      schema: slowdata [channel] @timestamp(with time zone) = value
    object:
      schema: slowdata_obj [channel] = value
    object_time_series:
      schema: slowdata_objts [channel] @timestamp(with time zone) = value
