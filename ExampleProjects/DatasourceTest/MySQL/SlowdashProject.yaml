slowdash_project:
  name: MySQL_Test
  
  data_source:
    #type: MySQL              # default: Async version, uses aiomysql
    #type: MySQL_NoAsync      # No-Async default: enable this to enforce this No-Async version (mysql-connector)
    #type: MySQL_mysqlclient  # No-Async alternative, uses mysqlclient

    url: ${DB_URL:-mysql://slowdash:slowdash@127.0.0.1:3306/SlowStore}
    
    time_series:
      schema: slowdata [channel] @timestamp(unix) = value
    object:
      schema: slowdata_obj [channel] = value
    object_time_series:
      schema: slowdata_objts [channel] @timestamp(unix) = value
