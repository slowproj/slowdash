slowdash_project:
  name: SQLite_Test
  data_source:
    url: sqlite:///SlowStore
    time_series:
      schema: slowdata [channel] @timestamp(unix) = value
    object:
      schema: slowdata_obj [channel] = value
    object_time_series:
      schema: slowdata_objts [channel] @timestamp(unix) = value

    view:
      - name: ts_raw
        sql: select * from slowdata order by timestamp desc limit 20
      - name: obj_raw
        sql: select * from slowdata_obj
      - name: objts_raw
        sql: select * from slowdata_objts order by timestamp desc limit 20
      - name: hist_raw
        sql: select * from slowdata_obj where channel="test_histogram"
